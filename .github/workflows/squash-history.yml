name: Fix release tags after squash (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repoint tags to current main (squashed) commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NEW_SHA=$(git rev-parse main)
          echo "Новый коммит: $NEW_SHA"

          for tag in $(git tag -l); do
            OLD_SHA=$(git rev-parse "$tag")
            if [ "$OLD_SHA" != "$NEW_SHA" ]; then
              echo "Переставляю тег $tag: $OLD_SHA -> $NEW_SHA"
              git tag -f "$tag" "$NEW_SHA"
              git push origin "refs/tags/$tag" --force
            else
              echo "Тег $tag уже указывает на актуальный коммит"
            fi
          done
